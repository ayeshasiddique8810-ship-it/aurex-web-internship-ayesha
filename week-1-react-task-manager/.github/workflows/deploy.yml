name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: week-1-react-task-manager/package-lock.json

      - name: Install dependencies
        working-directory: week-1-react-task-manager
        run: npm ci

      - name: Build React app
        working-directory: week-1-react-task-manager
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: week-1-react-task-manager/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4