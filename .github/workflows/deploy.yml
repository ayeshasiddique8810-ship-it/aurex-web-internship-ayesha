name: Deploy React Apps to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Week 1 dependencies
        working-directory: week-1-react-task-manager
        run: npm ci

      - name: Build Week 1 app
        working-directory: week-1-react-task-manager
        run: npm run build

      - name: Install Week 2 dependencies
        working-directory: week-1-react-task-manager/week-2-api-dashboard
        run: npm ci

      - name: Build Week 2 app
        working-directory: week-1-react-task-manager/week-2-api-dashboard
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir -p deploy/week-2-api-dashboard
          cp -r week-1-react-task-manager/dist/. deploy/
          cp -r week-1-react-task-manager/week-2-api-dashboard/dist/. deploy/week-2-api-dashboard/
           touch deploy/.nojeky11

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
